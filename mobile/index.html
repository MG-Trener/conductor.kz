<!doctype html>
<html lang="ru-KZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CONDUCTOR Склад">
  <title>CONDUCTOR — склад</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js" crossorigin>
  <link rel="modulepreload" href="./app.js?v=24">
  <link rel="preload" href="./warehouse-splash-vintage.png?v=1" as="image" type="image/png">
  <link rel="manifest" href="./manifest.webmanifest?v=16">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=15">
  <link rel="stylesheet" href="./warehouse.css?v=20">
  <link rel="stylesheet" href="./requests.css?v=1">
  <link rel="stylesheet" href="./splash.css?v=3">
</head>
<body>
  <div id="boot" class="boot" data-min-display-ms="2200" aria-label="Поехали на склад — приложение загружается"></div>

  <div id="login" class="screen hidden">
    <main class="center-wrap">
      <section class="auth-card">
        <div class="brand">CONDUCTOR<span>.KZ</span></div>
        <div class="eyebrow">Складской доступ</div>
        <h1>Вход</h1>
        <form id="login-form" class="form-stack">
          <label>Email<input id="email" type="email" autocomplete="username" required placeholder="name@company.kz"></label>
          <label>Пароль<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
          <button class="btn primary full" type="submit">Войти</button>
        </form>
        <button id="reset-password-login" class="link-action" type="button">Восстановить пароль</button>
        <p id="login-error" class="error"></p>
      </section>
    </main>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar warehouse-topbar">
      <div class="topbar-brand-block">
        <div class="mini-brand">CONDUCTOR<span>.KZ</span></div>
        <div id="page-subtitle" class="top-subtitle">Склад сегодня</div>
      </div>
      <div class="topbar-actions">
        <div class="user-chip" title="Авторизованный сотрудник">
          <b id="current-user-name">—</b>
          <small id="current-user-email"></small>
        </div>
        <a class="site-btn" href="https://conductor.kz/" target="_blank" rel="noopener">↗ Сайт</a>
        <button id="logout" class="site-btn logout-btn" type="button">Выйти</button>
      </div>
    </header>

    <main class="content">
      <section id="view-dashboard" class="view active">
        <div class="metric-grid">
          <article class="metric"><span>Стоимость склада</span><b id="metric-stock-value">0 ₸</b></article>
          <article class="metric"><span>Продажи сегодня</span><b id="metric-sales">0 ₸</b></article>
          <button class="metric request-metric" type="button" data-nav="requests"><span>Новые заявки</span><b id="metric-requests">0</b><small>Открыть заявки покупателей</small></button>
          <button id="open-cash-dialog" class="metric cash-metric" type="button"><span>Доступно в кассе</span><b id="metric-cash">0 ₸</b><small>Нажмите, чтобы вывести средства</small></button>
        </div>

        <div class="section-head"><h2>Картина склада</h2><button class="link-btn" data-nav="stock">Открыть склад</button></div>
        <div id="inventory-overview" class="inventory-overview"></div>

        <div class="section-head"><h2>Быстрые действия</h2></div>
        <div class="quick-grid">
          <button class="quick pink" data-nav="sale"><span>＋</span><b>Зафиксировать продажу</b><small>Списать конкретный цвет</small></button>
          <button class="quick green" data-nav="stock"><span>▦</span><b>Актуальные остатки</b><small>Все модели и цвета</small></button>
          <button class="quick blue" data-nav="sales"><span>≡</span><b>Продажи</b><small>Кто и когда внёс</small></button>
          <button class="quick request-quick" data-nav="requests"><span>●</span><b>Заявки покупателей</b><small>Позвонить и обработать</small></button>
        </div>
