name: Private auth claims migration once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-auth-claims-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install one-time Firebase Admin SDK
        run: npm install --no-save --package-lock=false firebase-admin@13.4.0

      - name: Repair and syntax-check one-time migration parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/private-auth-claims-once.mjs')
          text = path.read_text()
          replacements = {
              r'/\[\"([^\"]+)\",\s*\"([^\"]+)\"\]/gu':
                  r'/\["([^"]+)",\s*"([^"]+)"\]/gu',
              r'/function employeeName\(email = \"\", explicit = \"\"\) \{[\s\S]*?function createdByName\(item\) \{[\s\S]*?\n\}/u':
                  r'/function employeeName\(email = "", explicit = ""\) \{[\s\S]*?function createdByName\(item\) \{[\s\S]*?\n\}/u',
              r'/test\(\"authorization allowlist is pinned to the two Firebase UIDs\", async \(\) => \{[\s\S]*?\n\}\);\n?$/u':
                  r'/test\("authorization allowlist is pinned to the two Firebase UIDs", async \(\) => \{[\s\S]*?\n\}\);\n?$/u',
              r'/const staffUid = \"[^\"]+\";\nconst secondStaffUid = \"[^\"]+\";\nconst staffEmail = \"[^\"]+\";\nconst secondStaffEmail = \"[^\"]+\";/u':
                  r'/const staffUid = "[^"]+";\nconst secondStaffUid = "[^"]+";\nconst staffEmail = "[^"]+";\nconst secondStaffEmail = "[^"]+";/u',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'one-time parser marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check .github/private-auth-claims-once.mjs

      - name: Assign server claims, scrub email audit data, and migrate source
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_CONDUCTOR_REQUESTS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONDUCTOR_REQUESTS }}
        run: node .github/private-auth-claims-once.mjs

      - name: Restore locked dependencies
        run: npm ci

      - name: Run full regression and Firestore rules suite
        run: npm test

      - name: Deploy custom-claim Firestore rules to production
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_CONDUCTOR_REQUESTS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONDUCTOR_REQUESTS }}
        run: |
          set -euo pipefail
          SA="${FIREBASE_SERVICE_ACCOUNT_CONDUCTOR_REQUESTS:-${FIREBASE_SERVICE_ACCOUNT_JSON:-${FIREBASE_SERVICE_ACCOUNT:-}}}"
          if [ -z "$SA" ]; then
            echo 'Firebase service account secret is missing.' >&2
            exit 2
          fi
          printf '%s' "$SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npx firebase deploy --only firestore:rules --project conductor-requests --non-interactive

      - name: Commit privacy-hardened authentication
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            firestore.rules \
            mobile/app.js \
            mobile/analytics.js \
            mobile/sales-history.js \
            mobile/warehouse-domain.js \
            mobile/warehouse-ui.js \
            mobile/push-notifications.js \
            mobile/app-version.json \
            mobile/version-history.js \
            push-worker/src/index.js \
            tests/auth-security.test.mjs \
            tests/firestore.rules.test.mjs \
            android-app/package.json \
            android-app/package-lock.json
          git diff --cached --check
          git commit -m "security: authorize warehouse by private Firebase claims"
          git push origin main
