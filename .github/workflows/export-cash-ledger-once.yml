name: Export cash ledger once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-cash-ledger-once.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin@13
      - name: Export current cash ledger
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_CONDUCTOR_REQUESTS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONDUCTOR_REQUESTS }}
        shell: bash
        run: |
          set -euo pipefail
          SA="${FIREBASE_SERVICE_ACCOUNT_CONDUCTOR_REQUESTS:-${FIREBASE_SERVICE_ACCOUNT_JSON:-${FIREBASE_SERVICE_ACCOUNT:-}}}"
          if [ -z "$SA" ]; then
            echo 'No service account secret is configured.' >&2
            exit 2
          fi
          printf '%s' "$SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          node --input-type=module <<'NODE' > /tmp/cash-ledger.json
          import { initializeApp, applicationDefault } from 'firebase-admin/app';
          import { getFirestore, Timestamp } from 'firebase-admin/firestore';

          initializeApp({ credential: applicationDefault(), projectId: 'conductor-requests' });
          const db = getFirestore();
          const toIso = (v) => v instanceof Timestamp ? v.toDate().toISOString() : (v?.toDate ? v.toDate().toISOString() : null);
          const ordersSnap = await db.collection('orders').get();
          const withdrawalsSnap = await db.collection('cashWithdrawals').get();
          const cashSnap = await db.doc('finance/cash').get();
          const rows = [];
          for (const d of ordersSnap.docs) {
            const x = d.data();
            if (x.operationType === 'cash_deposit' || x.operationType === 'cash_sawmill') {
              rows.push({
                id: d.id,
                type: x.operationType,
                amount: Number(x.amount || 0),
                delta: Number(x.cashDelta || 0),
                before: Number(x.before || 0),
                after: Number(x.after || 0),
                note: String(x.note || ''),
                person: String(x.createdByName || 'Сотрудник'),
                at: toIso(x.createdAt) || x.createdAtClient || null
              });
              continue;
            }
            if (Array.isArray(x.items) && Number.isFinite(Number(x.total))) {
              const total = Number(x.total || 0);
              if (x.status === 'done') {
                rows.push({ id: d.id, type: 'sale', amount: total, delta: total, note: String(x.note || ''), person: String(x.createdByName || 'Сотрудник'), at: toIso(x.createdAt) || x.createdAtClient || null });
              } else if (x.status === 'cancelled') {
                rows.push({ id: d.id, type: 'sale', amount: total, delta: total, note: String(x.note || ''), person: String(x.createdByName || 'Сотрудник'), at: toIso(x.createdAt) || x.createdAtClient || null });
                rows.push({ id: d.id + ':cancel', type: 'cancel_sale', amount: total, delta: -total, note: '', person: String(x.cancelledByName || 'Сотрудник'), at: toIso(x.cancelledAt) || null });
              }
            }
          }
          for (const d of withdrawalsSnap.docs) {
            const x = d.data();
            const amount = Number(x.amount || 0);
            rows.push({ id: d.id, type: 'withdrawal', amount, delta: -amount, before: Number(x.before || 0), after: Number(x.after || 0), note: String(x.comment || ''), person: String(x.createdByName || 'Сотрудник'), at: toIso(x.createdAt) || x.createdAtClient || null });
          }
          rows.sort((a,b) => String(a.at || '').localeCompare(String(b.at || '')));
          const cash = cashSnap.exists ? cashSnap.data() : {};
          console.log(JSON.stringify({
            currentBalance: Number(cash.balance || 0),
            lastOperationType: cash.lastOperationType || null,
            lastOperationId: cash.lastOperationId || null,
            count: rows.length,
            rows
          }, null, 2));
          NODE
      - name: Upload ledger
        uses: actions/upload-artifact@v4
        with:
          name: cash-ledger
          path: /tmp/cash-ledger.json
          if-no-files-found: error
          retention-days: 1
