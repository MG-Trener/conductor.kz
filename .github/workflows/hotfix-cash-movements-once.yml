name: Apply cash movement hotfix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-cash-movements-once.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch Firestore rules candidate
        run: |
          python .github/hotfix_cash_movements.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Capture Firestore rule test diagnostics
        run: |
          set +e
          npm run test:rules > .github/hotfix-test.txt 2>&1
          code=$?
          echo "exit_code=$code" >> .github/hotfix-test.txt
          git checkout -- firestore.rules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/hotfix-test.txt
          git commit -m "ci: capture cash rules diagnostics"
          git push origin HEAD:main
          exit 0
