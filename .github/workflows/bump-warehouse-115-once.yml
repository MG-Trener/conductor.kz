name: Bump warehouse 1.1.5 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-warehouse-115-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply version bump
        run: |
          python .github/bump_warehouse_115.py
          git diff --check
          grep -n '"version": "1.1.5"' android-app/package.json android-app/package-lock.json mobile/app-version.json
          grep -n 'Актуальная версия: 1.1.5' mobile/version-history.js

      - name: Commit version 1.1.5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/package.json android-app/package-lock.json mobile/app-version.json mobile/version-history.js
          git commit -m "release: warehouse 1.1.5 cash movement fix"
          git push origin HEAD:main
