name: Apply DM60R1G product

on:
  push:
    branches: [main]
    paths:
      - '.github/dm60r1g-ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply DM60R1G changes
        run: |
          cp assets/images/dm60r1g.webp /tmp/dm60r1g.webp
          sed -i 's/a3588a456558b336235f98bc9046ff3cb34603aaeea824ed55b716b2f5763eb9/dad53a7914da1a20c56d3dba4d7146ed7a190fffa7c49ed0bd80f05da59687b6/' .github/scripts/apply-dm60r1g.mjs
          node .github/scripts/apply-dm60r1g.mjs
          cp /tmp/dm60r1g.webp assets/images/dm60r1g.webp
      - name: Install test dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Commit product release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add DM60R1G product and shared catalog pricing"
          git push origin HEAD:main
