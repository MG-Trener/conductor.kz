name: Apply DM60R1G product

on:
  push:
    branches: [main]
    paths:
      - '.github/dm60r1g-ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply DM60R1G changes
        run: |
          cp assets/images/dm60r1g.webp /tmp/dm60r1g.webp
          sed -i 's/a3588a456558b336235f98bc9046ff3cb34603aaeea824ed55b716b2f5763eb9/dad53a7914da1a20c56d3dba4d7146ed7a190fffa7c49ed0bd80f05da59687b6/' .github/scripts/apply-dm60r1g.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-dm60r1g.mjs')
          s = p.read_text()
          s = s.replace('return text.replace(before, after);', 'return text.replace(before, () => after);')
          s = s.replace('return text.replace(regex, replacement);', 'return text.replace(regex, () => replacement);')
          p.write_text(s)
          PY
          node .github/scripts/apply-dm60r1g.mjs
          cp /tmp/dm60r1g.webp assets/images/dm60r1g.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/public-prices-pages.test.mjs')
          s = p.read_text()
          old = r'assert.match(rules, /DM60G\|DM90/);'
          new = r'assert.match(rules, /DM60G\|DM60R1G\|DM90/);'
          if old not in s:
              raise SystemExit('Old DM60G rule assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install test dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Commit product release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add DM60R1G product and shared catalog pricing"
          git push origin HEAD:main
