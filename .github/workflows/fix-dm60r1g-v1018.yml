name: Fix DM60R1G runtime v1.0.18

on:
  push:
    branches: [main]
    paths:
      - '.github/dm60r1g-v1018-ready'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch runtime, pricing and version
        run: python3 .github/scripts/fix-dm60r1g-v1018.py
      - name: Install test dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Validate JavaScript syntax
        run: |
          node --check mobile/app.js
          node --check mobile/inventory-state.js
          node --check assets/public-prices.js
      - name: Commit v1.0.18
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.js mobile/inventory-state.js assets/public-prices.js mobile/index.html mobile/bootstrap-104.js mobile/sw.js mobile/app-version.json mobile/version-history-105.js android-app/package.json tests/mobile-architecture.test.mjs
          git commit -m "Fix DM60R1G variants and stale prices in v1.0.18"
          git push origin HEAD:main
