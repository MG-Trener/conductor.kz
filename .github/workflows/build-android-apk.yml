name: Build CONDUCTOR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/in-app-updates
    paths:
      - "android-app/**"
      - "mobile/**"
      - "firestore.rules"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate mobile and updater scripts
        run: |
          node --check mobile/app-update.js
          node --check mobile/bootstrap.js
          node --check mobile/push-notifications.js
          node --check mobile/firestore-error-help.js
          node --check mobile/analytics.js
          node --check mobile/sales-history.js
          node --check mobile/warehouse-enhancements.js
          node --check mobile/version-history.js
          node --check mobile/ui-fixes-070.js
          node --check mobile/inventory-state.js
          node --check android-app/configure-android.mjs
          node --check android-app/configure-updater.mjs
          node -e "const p=require('./android-app/package.json'); const m=require('./mobile/app-version.json'); if(p.version!==m.version) throw new Error('Android and update manifest versions differ')"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install repository test dependencies
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Determine whether this version should be published
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./android-app/package.json').version")
          CURRENT_TITLE=$(gh release view warehouse-latest --json name -q .name 2>/dev/null || true)
          if [ "$CURRENT_TITLE" = "CONDUCTOR Склад v${VERSION}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published; build will be validated but the permanent release will not be overwritten."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is new and will be published after a successful signed build."
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare bundled mobile web app
        shell: bash
        run: |
          rm -rf android-app/www
          mkdir -p android-app/www
          cp -R mobile/. android-app/www/
          test -f android-app/www/index.html
          test -f android-app/www/bootstrap.js
          test -f android-app/www/app.js

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install

      - name: Generate and sync Android project
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Verify bundled Android configuration
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'android-app/android/app/src/main/assets/capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.server?.url) throw new Error(`Production Android build must not use remote server.url: ${config.server.url}`);
          const webIndex = 'android-app/android/app/src/main/assets/public/index.html';
          const bootstrap = 'android-app/android/app/src/main/assets/public/bootstrap.js';
          if (!fs.existsSync(webIndex) || !fs.existsSync(bootstrap)) throw new Error('Bundled mobile UI was not copied into the Android app');
          NODE

      - name: Install Firebase Android configuration
        shell: bash
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_BASE64" ]; then
            echo "::error::Missing FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64. Register kz.conductor.warehouse in Firebase and store google-services.json as a Base64 GitHub Actions secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > android-app/android/app/google-services.json
          node - <<'NODE'
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync('android-app/android/app/google-services.json', 'utf8'));
          const packages = (json.client || []).map((client) => client?.client_info?.android_client_info?.package_name).filter(Boolean);
          if (!packages.includes('kz.conductor.warehouse')) {
            throw new Error(`google-services.json does not contain kz.conductor.warehouse; found: ${packages.join(', ') || 'none'}`);
          }
          NODE

      - name: Prepare release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WAREHOUSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WAREHOUSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WAREHOUSE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android-app/warehouse-release.jks"
            keytool -list -keystore "$GITHUB_WORKSPACE/android-app/warehouse-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Permanent Android signing secrets are required for main releases. Refusing to publish an APK with an ephemeral debug signature."
              exit 1
            fi
            echo "Signing secrets are absent; a debug APK may be built only on non-main branches."
          fi

      - name: Configure Android version and native updater
        working-directory: android-app
        env:
          WAREHOUSE_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          node configure-android.mjs
          node configure-updater.mjs

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-app/android
        env:
          WAREHOUSE_KEYSTORE_PATH: ${{ github.workspace }}/android-app/warehouse-release.jks
          WAREHOUSE_KEYSTORE_PASSWORD: ${{ secrets.WAREHOUSE_KEYSTORE_PASSWORD }}
          WAREHOUSE_KEY_ALIAS: ${{ secrets.WAREHOUSE_KEY_ALIAS }}
          WAREHOUSE_KEY_PASSWORD: ${{ secrets.WAREHOUSE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build debug APK for non-main branches
        if: steps.signing.outputs.enabled != 'true' && github.ref != 'refs/heads/main'
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK file
        if: steps.signing.outputs.enabled == 'true' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            cp android-app/android/app/build/outputs/apk/release/app-release.apk dist/CONDUCTOR-Sklad.apk
          else
            cp android-app/android/app/build/outputs/apk/debug/app-debug.apk dist/CONDUCTOR-Sklad.apk
          fi
          sha256sum dist/CONDUCTOR-Sklad.apk

      - name: Upload APK artifact
        if: steps.signing.outputs.enabled == 'true' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CONDUCTOR-Warehouse-APK
          path: dist/CONDUCTOR-Sklad.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent warehouse release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true' && steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./android-app/package.json').version")
          NOTES=$(node -p "require('./mobile/app-version.json').notes")
          if gh release view warehouse-latest >/dev/null 2>&1; then
            gh release upload warehouse-latest dist/CONDUCTOR-Sklad.apk --clobber
            gh release edit warehouse-latest --target "$GITHUB_SHA" --title "CONDUCTOR Склад v${VERSION}" --notes "$NOTES"
          else
            gh release create warehouse-latest dist/CONDUCTOR-Sklad.apk \
              --target "$GITHUB_SHA" \
              --title "CONDUCTOR Склад v${VERSION}" \
              --notes "$NOTES"
          fi
