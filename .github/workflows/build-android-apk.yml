name: Build CONDUCTOR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/in-app-updates
    paths:
      - "android-app/**"
      - "mobile/app-update.js"
      - "mobile/app-version.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate updater scripts
        run: |
          node --check mobile/app-update.js
          node --check android-app/configure-android.mjs
          node -e "const p=require('./android-app/package.json'); const m=require('./mobile/app-version.json'); if(p.version!==m.version) throw new Error('Android and update manifest versions differ')"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install

      - name: Generate Android project
        working-directory: android-app
        run: npx cap add android

      - name: Prepare release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WAREHOUSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WAREHOUSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WAREHOUSE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android-app/warehouse-release.jks"
            keytool -list -keystore "$GITHUB_WORKSPACE/android-app/warehouse-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Permanent Android signing secrets are required for main releases. Refusing to publish an APK with an ephemeral debug signature."
              exit 1
            fi
            echo "Signing secrets are absent; a debug APK may be built only on non-main branches."
          fi

      - name: Configure Android version
        working-directory: android-app
        env:
          WAREHOUSE_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: node configure-android.mjs

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-app/android
        env:
          WAREHOUSE_KEYSTORE_PATH: ${{ github.workspace }}/android-app/warehouse-release.jks
          WAREHOUSE_KEYSTORE_PASSWORD: ${{ secrets.WAREHOUSE_KEYSTORE_PASSWORD }}
          WAREHOUSE_KEY_ALIAS: ${{ secrets.WAREHOUSE_KEY_ALIAS }}
          # The generated keystore is PKCS12. Its private key uses the store password.
          # Keeping one source of truth prevents a mismatched key password from breaking releases.
          WAREHOUSE_KEY_PASSWORD: ${{ secrets.WAREHOUSE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build debug APK for non-main branches
        if: steps.signing.outputs.enabled != 'true' && github.ref != 'refs/heads/main'
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK file
        if: steps.signing.outputs.enabled == 'true' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            cp android-app/android/app/build/outputs/apk/release/app-release.apk dist/CONDUCTOR-Sklad.apk
          else
            cp android-app/android/app/build/outputs/apk/debug/app-debug.apk dist/CONDUCTOR-Sklad.apk
          fi

      - name: Upload APK artifact
        if: steps.signing.outputs.enabled == 'true' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CONDUCTOR-Warehouse-APK
          path: dist/CONDUCTOR-Sklad.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent warehouse release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./android-app/package.json').version")
          NOTES=$(node -p "require('./mobile/app-version.json').notes")
          if gh release view warehouse-latest >/dev/null 2>&1; then
            gh release upload warehouse-latest dist/CONDUCTOR-Sklad.apk --clobber
            gh release edit warehouse-latest --title "CONDUCTOR Склад v${VERSION}" --notes "$NOTES"
          else
            gh release create warehouse-latest dist/CONDUCTOR-Sklad.apk \
              --target "$GITHUB_SHA" \
              --title "CONDUCTOR Склад v${VERSION}" \
              --notes "$NOTES"
          fi
