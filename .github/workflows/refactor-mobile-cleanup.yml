name: Refactor and clean mobile app

on:
  push:
    branches: [refactor/mobile-cleanup-v2]
    paths:
      - '.github/workflows/refactor-mobile-cleanup.yml'

permissions:
  contents: write

jobs:
  refactor-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/mobile-cleanup-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare guarded refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/refactor_mobile_cleanup.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const ready = initialized.has(item.id);', 'const ready = initialized.has(item.id) || item.virtual;')
          p.write_text(s, encoding='utf-8')
          PY
          python3 scripts/refactor_mobile_cleanup.py

      - name: Modernize legacy architecture tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('tests/public-prices-pages.test.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const mobileBootstrap = new URL("../mobile/bootstrap-103.js", import.meta.url);', 'const mobileBootstrap = new URL("../mobile/bootstrap.js", import.meta.url);')
          s = s.replace('const inventoryState = new URL("../mobile/inventory-state.js", import.meta.url);\n', '')
          s = s.replace('/app\\.js\\?v=103/', '/app\\.js\\?v=109/')
          old = re.compile(r'test\("Firestore is initialized once before any asynchronous auth setup", async \(\) => \{[\s\S]*?\n\}\);\n\n(?=test\("the header contains a visible warehouse login)', re.M)
          new = '''test("Firestore is initialized once before any asynchronous auth setup", async () => {
            const [app, ui, html, worker, bootstrap] = await Promise.all([
              readFile(mobileApp, "utf8"),
              readFile(new URL("../mobile/warehouse-ui.js", import.meta.url), "utf8"),
              readFile(mobileHtml, "utf8"),
              readFile(mobileWorker, "utf8"),
              readFile(mobileBootstrap, "utf8")
            ]);
            const initializeIndex = app.indexOf("state.db = initializeFirestore(");
            const firstAwaitIndex = app.indexOf("await setPersistence(");
            assert.ok(initializeIndex >= 0 && initializeIndex < firstAwaitIndex);
            assert.match(app, /window\\.CONDUCTOR_FIRESTORE = state\\.db/);
            assert.doesNotMatch(ui, /initializeFirestore|getFirestore/);
            assert.match(html, /firebase-config\\.js\\?v=\\d+/);
            assert.match(html, /bootstrap\\.js\\?v=1/);
            assert.doesNotMatch(bootstrap, /inventory-state/);
            assert.doesNotMatch(worker, /inventory-state/);
          });

'''
          s, count = old.subn(new, s, count=1)
          if count != 1:
            raise SystemExit('Failed to modernize Firestore ownership test')
          s = s.replace('/bootstrap-103\\.js/', '/bootstrap\\.js\\?v=1/')
          s = s.replace('/import "\\.\\/push-notifications\\.js\\?v=103"/', '/import "\\.\\/push-notifications\\.js\\?v=1"/')
          s = s.replace('/"\\.\\/push-notifications\\.js\\?v=103"/', '/"\\.\\/push-notifications\\.js\\?v=1"/')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install repository dependencies
        run: npm ci

      - name: Run full repository tests
        run: npm test

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Android web bundle
        run: |
          rm -rf android-app/www
          mkdir -p android-app/www
          cp -R mobile/. android-app/www/
          test -f android-app/www/app.js
          test -f android-app/www/bootstrap.js
          test -f android-app/www/warehouse-ui.js
          test ! -f android-app/www/inventory-state.js
          test ! -f android-app/www/warehouse-enhancements-legacy.js

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install

      - name: Generate Android project
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Firebase Android configuration
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_BASE64"
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > android-app/android/app/google-services.json

      - name: Configure Android and native updater
        working-directory: android-app
        run: |
          node configure-android.mjs
          node configure-updater.mjs

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify debug APK structure
        run: |
          APK=android-app/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -gt $((8 * 1024 * 1024)) ]; then echo "APK too large after cleanup: $SIZE"; exit 1; fi

      - name: Commit tested refactor
        run: |
          rm -f android-app/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'No refactor changes produced'; exit 1; }
          git commit -m "Refactor mobile core and remove legacy artifacts"
          git push origin HEAD:refactor/mobile-cleanup-v2
