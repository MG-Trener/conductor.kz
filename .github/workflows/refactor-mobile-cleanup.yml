name: Refactor and clean mobile app

on:
  push:
    branches: [refactor/mobile-cleanup-v2]
    paths:
      - '.github/workflows/refactor-mobile-cleanup.yml'

permissions:
  contents: write

jobs:
  refactor-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/mobile-cleanup-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare guarded refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/refactor_mobile_cleanup.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const ready = initialized.has(item.id);', 'const ready = initialized.has(item.id) || item.virtual;')
          p.write_text(s, encoding='utf-8')
          PY
          python3 scripts/refactor_mobile_cleanup.py

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install repository dependencies
        run: npm ci

      - name: Run full repository tests
        run: npm test

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Android web bundle
        run: |
          rm -rf android-app/www
          mkdir -p android-app/www
          cp -R mobile/. android-app/www/
          test -f android-app/www/app.js
          test -f android-app/www/bootstrap.js
          test -f android-app/www/warehouse-ui.js
          test ! -f android-app/www/inventory-state.js
          test ! -f android-app/www/warehouse-enhancements-legacy.js

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install

      - name: Generate Android project
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Firebase Android configuration
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_BASE64"
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > android-app/android/app/google-services.json

      - name: Configure Android and native updater
        working-directory: android-app
        run: |
          node configure-android.mjs
          node configure-updater.mjs

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify debug APK structure
        run: |
          APK=android-app/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -gt $((8 * 1024 * 1024)) ]; then echo "APK too large after cleanup: $SIZE"; exit 1; fi

      - name: Commit tested refactor
        run: |
          rm -f android-app/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'No refactor changes produced'; exit 1; }
          git commit -m "Refactor mobile core and remove legacy artifacts"
          git push origin HEAD:refactor/mobile-cleanup-v2
